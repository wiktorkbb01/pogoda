<style>
/* SF Pro: użyje zainstalowanej czcionki albo plików z folderu fonts/ obok tego pliku */
@font-face{font-family:SFP;font-weight:200;src:local("SF Pro Display Light"),local("SFProDisplay-Light"),local("SF Pro"),url("fonts/SF-Pro-Display-Light.otf")}
@font-face{font-family:SFP;font-weight:400;src:local("SF Pro Text Regular"),local("SFProText-Regular"),local("SF Pro Display Regular"),local("SF Pro"),url("fonts/SF-Pro-Text-Regular.otf")}
@font-face{font-family:SFP;font-weight:500;src:local("SF Pro Text Medium"),local("SFProText-Medium"),local("SF Pro"),url("fonts/SF-Pro-Text-Medium.otf")}
@font-face{font-family:SFP;font-weight:600;src:local("SF Pro Text Semibold"),local("SFProText-Semibold"),local("SF Pro"),url("fonts/SF-Pro-Text-Semibold.otf")}

:root{--g1:#2f6fd0;--g2:#8ec5fc;--glass:rgba(40,80,150,.34);--chip:rgba(255,255,255,.16);--txt:#fff;--sub:rgba(255,255,255,.68)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:SFP,"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:400;color:var(--txt);background:linear-gradient(180deg,var(--g1),var(--g2)) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg.i{width:1em;height:1em;display:block}
.app{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.bar{display:flex;gap:8px;height:50px;align-items:center;grid-column:1/-1}
.bar button{width:42px;height:42px;border-radius:50%;font-size:21px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22)}
.bar .sp{margin-right:auto}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border-radius:24px;padding:15px 17px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2),0 8px 30px rgba(0,0,0,.06);min-width:0}
.lab{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);display:flex;gap:6px;align-items:center;margin-bottom:10px}
.lab .i{font-size:15px}
.hero{text-shadow:0 1px 16px rgba(0,0,0,.2)}
.hero .temp{font-weight:200;line-height:1}
.rest{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.rest>.hl,.rest>.condc,.rest>.fc{grid-column:span 2}
.big{font-size:34px;font-weight:500;line-height:1.1}
.note{font-size:14px;color:var(--sub);margin-top:8px;line-height:1.3}
.hli{display:flex;gap:10px;align-items:flex-start;font-size:20px;font-weight:500;line-height:1.25;margin-bottom:10px}
.hli .i{font-size:26px;flex:0 0 auto;margin-top:1px;color:#bfe6ff}
.foot{font-size:13px;color:var(--sub);margin-top:auto;padding-top:10px}
.hl{display:flex;flex-direction:column}
.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ch .t{font-size:20px;font-weight:600}.ch .s{font-size:14px;color:var(--sub);margin-top:2px}
.seg{display:flex;background:rgba(0,0,0,.2);border-radius:999px;padding:3px}
.seg button{width:44px;height:32px;border-radius:999px;display:grid;place-items:center;font-size:19px;opacity:.75}
.seg button.on{background:rgba(255,255,255,.28);opacity:1}
.hourly{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hourly::-webkit-scrollbar{display:none}
.h{flex:0 0 auto;min-width:60px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:17px;font-weight:500}
.h>.i,.h>svg{font-size:30px}.h small{font-size:12px;color:#9fe3ff;min-height:14px;font-weight:600}
.h b{font-weight:500}.h .dp{font-size:26px;color:#7fd0ff}.h .ar{font-size:26px}
.day{display:grid;grid-template-columns:62px 34px 1fr;align-items:center;gap:8px;padding:11px 0;border-top:1px solid rgba(255,255,255,.18);font-size:18px;font-weight:500}
.day:first-of-type{border-top:0}.day .i{font-size:26px}
.rng{display:grid;grid-template-columns:40px 1fr 40px;gap:10px;align-items:center;text-align:right}
.rng span:nth-child(3){text-align:left}.rng .lo{color:var(--sub)}
.trk{height:5px;border-radius:3px;background:rgba(0,0,0,.24);position:relative}
.trk i{position:absolute;top:0;bottom:0;border-radius:3px;background-image:linear-gradient(90deg,#5fc8ff,#7fe39b,#ffd24d,#ff9a3d)}
.comp{width:150px;max-width:100%;display:block;margin:0 auto}
.uvb{height:6px;border-radius:3px;background:linear-gradient(90deg,#4cd964,#ffd60a,#ff9f0a,#ff453a,#bf5af2);position:relative;margin-top:14px}
.uvb i{position:absolute;top:-2px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.moonsvg,.arc{display:block;margin:2px auto 0}.arc{width:100%;height:auto;max-height:70px}
.upd{text-align:center;font-size:12px;color:var(--sub);margin:18px 0 0;grid-column:1/-1}
.err{padding:30px 10px;text-align:center;color:var(--sub)}
.more{width:100%;margin-top:8px;padding:15px;border-radius:20px;background:var(--chip);font-size:20px}
#ov{position:fixed;inset:0;background:rgba(10,20,40,.55);backdrop-filter:blur(18px);display:none;padding:calc(env(safe-area-inset-top) + 20px) 16px;z-index:9;overflow:auto}
#ov.on{display:block}#ov .in{max-width:520px;margin:0 auto}
#q{width:100%;padding:13px 16px;border-radius:14px;border:0;background:rgba(255,255,255,.2);color:#fff;font:inherit;font-size:17px;outline:none}
#q::placeholder{color:rgba(255,255,255,.65)}
.res{display:block;width:100%;text-align:left;padding:13px 6px;border-bottom:1px solid rgba(255,255,255,.18)}
.res small{display:block;color:var(--sub)}
#scrim{position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.25);display:none}#scrim.on{display:block}
#side{position:fixed;left:0;top:0;bottom:0;width:min(350px,88vw);z-index:7;transform:translateX(-104%);transition:transform .3s cubic-bezier(.3,.8,.3,1);background:var(--glass);backdrop-filter:blur(34px) saturate(1.5);-webkit-backdrop-filter:blur(34px) saturate(1.5);padding:calc(env(safe-area-inset-top) + 16px) 14px 20px;overflow:auto;box-shadow:inset -.5px 0 0 rgba(255,255,255,.2)}
#side.on{transform:none}#side h3{font-size:26px;font-weight:600;margin:6px 6px 14px}
.pl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.13);margin-bottom:8px;cursor:pointer}
.pl.cur{background:rgba(255,255,255,.28)}.pl b{font-size:18px;font-weight:600;display:block}.pl small{color:var(--sub);font-size:13px}
.pt{font-size:30px;font-weight:300;margin-left:auto}.pd{opacity:.6;padding:4px 8px;font-size:14px}
/* iOS */
body.ios .hero{text-align:center;padding:22px 0 18px}
body.ios .city{font-size:34px}
body.ios .temp{font-size:104px;margin-left:.3em;margin-top:2px}
body.ios .cond{font-size:21px}body.ios .hl2{font-size:20px;font-weight:500}
body.ios .more{display:none}
@media(min-width:1000px){
 body.ios .app{max-width:1380px;display:grid;grid-template-columns:minmax(320px,35%) minmax(0,1fr);column-gap:34px;padding:14px 34px 50px}
 body.ios #main{display:contents}
 body.ios .hero{position:sticky;top:30px;align-self:start;text-align:left;padding:15vh 6px 0;grid-column:1;grid-row:3}
 body.ios .city{font-size:46px}
 body.ios .temp{font-size:clamp(150px,14vw,230px);margin:6px 0 10px -8px;letter-spacing:-.03em}
 body.ios .cond{font-size:32px}body.ios .hl2{font-size:30px;font-weight:400}
 body.ios .rest{grid-column:2;grid-row:3;margin-top:0;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(158px,auto);gap:14px}
 body.ios .rest>*{grid-column:span 2}
 body.ios .rest>.hl{grid-column:span 4;order:1}body.ios .rest>.wind{order:2}
 body.ios .rest>.condc{grid-column:span 6;order:3}
 body.ios .rest>.fc{grid-column:span 4;grid-row:span 3;order:4}
 body.ios .rest>.moon{order:5}body.ios .rest>.sun{order:6}body.ios .rest>.uv{order:7}
 body.ios .rest>.feels{order:8}body.ios .rest>.hum{order:9}body.ios .rest>.vis{order:10}body.ios .rest>.pres{order:11}body.ios .rest>.prec{order:12}
 body.ios .upd{grid-column:2;order:99}
}
/* HyperOS */
body.hyper .app{min-height:100vh;display:flex;flex-direction:column}
body.hyper .hero{padding:34px 6px 18px}
body.hyper .city{font-size:22px}
body.hyper .temp{font-size:190px;letter-spacing:-.04em;margin:30px 0 14px -6px;color:rgba(235,250,255,.9)}
body.hyper .cond{font-size:21px;display:inline}
body.hyper .hl2{display:inline;font-size:21px;margin-left:10px}
body.hyper .glass{border-radius:28px}
body.hyper .day{grid-template-columns:70px 44px 1fr;font-size:20px;padding:15px 8px}
body.hyper .day .i{font-size:28px;justify-self:center}
body.hyper .trk i{background-image:none;background:#5fe4f5}
body.hyper #main{margin-top:0;display:flex;flex-direction:column;flex:1}
body.hyper .rest{margin-top:auto}
body.hyper .x{display:none}body.hyper.full .x{display:flex;flex-direction:column}
@media(max-width:420px){body.hyper .temp{font-size:170px}body.ios .temp{font-size:92px}}
.dbg{position:fixed;left:12px;bottom:12px;width:300px;max-width:calc(100vw - 24px);max-height:78vh;overflow:auto;z-index:8;display:none;background:rgba(14,18,30,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:20px;padding:14px;font-size:13px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2)}
.dbg.on{display:block}
.dbg h4{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.dbg label{display:block;color:var(--sub);margin:10px 0 4px;font-weight:500}
.dbg .r{display:flex;gap:8px;align-items:center}
.dbg .r input{flex:1;accent-color:#6fe0ff}
.dbg .v{min-width:46px;text-align:right}
.dbg select{width:100%;padding:8px;border-radius:10px;border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit}
.dbg select option{color:#000}
.dbg .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dbg .chips button,.dbg .x{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12px}
.dbg .x{padding:4px 8px}

:root{--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1)}
.wi{overflow:visible}.h>.i,.h>svg{font-size:32px}
/* ===== liquid glass ===== */
.glass>*{position:relative;z-index:1}
.glass::before,.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0}
.glass::after{box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -1px 1px rgba(255,255,255,.14),inset 1px 0 1px rgba(255,255,255,.12),inset -1px 0 1px rgba(255,255,255,.12);background:linear-gradient(165deg,rgba(255,255,255,.14),rgba(255,255,255,0) 38%)}
.glass::before{background:radial-gradient(300px circle at var(--mx,50%) var(--my,0),rgba(255,255,255,.22),rgba(255,255,255,0) 65%);opacity:0;transition:opacity .45s}
.glass:hover::before{opacity:1}
.bar button{box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 0 0 .5px rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.08)}
.bar button,.pl,.more,.chips button,.x,.seg button{transition:transform .5s var(--spring),background .3s,filter .3s}
.bar button:hover{transform:translateY(-1px) scale(1.07);filter:brightness(1.15)}
.bar button:active,.pl:active,.more:active,.chips button:active,.x:active{transform:scale(.88)}
.seg{position:relative}.seg button{position:relative;z-index:1}.seg button.on{background:none}
.pill{position:absolute;left:3px;top:3px;width:44px;height:32px;border-radius:999px;background:rgba(255,255,255,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -1px 2px rgba(0,0,0,.12),0 3px 12px rgba(0,0,0,.18);pointer-events:none;will-change:transform}
#scrim{display:block;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}#scrim.on{opacity:1;pointer-events:auto}
#side{transition:transform .65s var(--ease)}
#side.on .pl{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*50ms + 140ms)}
#ov{display:block;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
#ov.on{opacity:1;visibility:visible;transition:opacity .35s}
#ov .in{transform:translateY(16px) scale(.95);transition:transform .6s var(--spring)}#ov.on .in{transform:none}
.res{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.hourly.swap .h{animation:hIn .6s var(--ease) both;animation-delay:calc(var(--d,0)*22ms)}
.uvb i{animation:uvm 1.3s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(26px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes glassIn{from{opacity:0;transform:translateY(36px) scale(.93)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes hIn{from{opacity:0;transform:translateX(24px) scale(.86)}to{opacity:1;transform:none}}
@keyframes needle{from{transform:rotate(calc(var(--a) - 150deg))}}
@keyframes uvm{from{left:0}}
@keyframes floaty{50%{transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translate(1px,-4px);opacity:0}30%{opacity:1}100%{transform:translate(-2px,6px);opacity:0}}
@keyframes drift{0%,100%{transform:translate(-1px,-2px)}50%{transform:translate(2px,4px)}}
@keyframes bolt{0%,86%,100%{opacity:1}90%{opacity:.25}93%{opacity:1}96%{opacity:.4}}
@keyframes tw{50%{opacity:.2}}
@media(prefers-reduced-motion:no-preference){
 #main.enter .hero>*{animation:rise 1s var(--ease) both;animation-delay:calc(var(--i,0)*80ms)}
 #main.enter .rest>.glass{animation:glassIn .95s var(--spring) both;animation-delay:calc(var(--i,0)*65ms + 180ms)}
 #main.enter .trk i{transform-origin:left center;animation:grow 1s var(--ease) both;animation-delay:calc(var(--r,0)*60ms + 700ms)}
 .ic-rays{transform-box:fill-box;transform-origin:center;animation:spin 45s linear infinite}
 .ic-drop{animation:fall 1.15s ease-in infinite}.ic-flake{animation:drift 3s ease-in-out infinite}
 .ic-bolt{animation:bolt 3.4s infinite}.ic-star{animation:tw 2.4s ease-in-out infinite}
 .moonsvg{animation:floaty 7s ease-in-out infinite}
}
@media(max-width:999px){body.ios .hero{transform:translateY(calc(var(--sc,0)*-26px)) scale(calc(1 - var(--sc,0)*.14));opacity:calc(1 - var(--sc,0)*.9);transform-origin:50% 0;will-change:transform,opacity}}

.sk{background:linear-gradient(100deg,rgba(255,255,255,.08) 20%,rgba(255,255,255,.24) 40%,rgba(255,255,255,.08) 60%);background-size:200% 100%;animation:shimmer 1.5s linear infinite;border-radius:12px;margin:10px auto}
.hero .sk:first-child{margin-top:26px}
@keyframes shimmer{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
.sh{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);margin:26px 8px 10px}
.us{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;font-size:16px}
.seg2{display:flex;background:rgba(0,0,0,.2);border-radius:999px;padding:3px}
.seg2 button{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;opacity:.8}
.seg2 button.on{background:rgba(255,255,255,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.15);opacity:1}
@media(min-width:1000px){body.ios .hero .sk{margin-left:0}body.ios .rest>.aq{order:13}}
.glass>.sk{margin:0 0 14px}
.upd a{color:inherit;text-decoration:underline;text-underline-offset:2px}

/* ===== kafelki: edycja, nowe wykresy, więcej ruchu ===== */
.rest{grid-auto-flow:dense}
.rest>.tchart{grid-column:span 2}
@media(min-width:1000px){body.ios .rest>.tchart{grid-column:span 4}}
.rest>.glass{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .55s var(--ease),opacity .8s var(--ease)}
.rest>.glass.pre{opacity:0;transform:translateY(46px) scale(.94)}
.rest>.glass.new{animation:popIn .8s var(--spring) both}
.del{display:none}
body.editing .app{padding-bottom:150px}
body.editing #editb{background:rgba(255,255,255,.35)}
body.editing .rest>.glass{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;animation:wig .3s ease-in-out infinite alternate;animation-delay:calc(var(--i,0)*-47ms)}
body.editing .rest>.glass *{pointer-events:none}
body.editing .rest>.glass .del{display:grid;place-items:center;pointer-events:auto;position:absolute;top:-9px;left:-9px;width:30px;height:30px;border-radius:50%;background:rgba(28,32,46,.85);color:#fff;font-size:20px;line-height:1;z-index:5;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.4);animation:popIn .5s var(--spring) both}

.ghost{z-index:60;pointer-events:none;scale:1;rotate:0deg;transition:scale .3s var(--spring),rotate .3s var(--spring),box-shadow .3s!important;box-shadow:0 8px 24px rgba(0,0,0,.15);will-change:transform;cursor:grabbing}
.ghost.lift{scale:1.045;rotate:1.3deg;box-shadow:0 34px 70px rgba(0,0,0,.4),inset 0 0 0 .5px rgba(255,255,255,.35)}
.ghost .del{display:none!important}
#ebar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,200%);z-index:12;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 0 0 .5px rgba(255,255,255,.25),0 14px 40px rgba(0,0,0,.28);transition:transform .7s var(--spring)}
body.editing #ebar{transform:translate(-50%,0)}
#ebar button{padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px}
#ebar .pri{background:rgba(255,255,255,.92);color:#10203a}
#tray{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));width:min(520px,calc(100vw - 24px));max-height:48vh;overflow:auto;transform:translate(-50%,40px) scale(.94);opacity:0;pointer-events:none;z-index:12;border-radius:26px;padding:14px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 0 0 .5px rgba(255,255,255,.25),0 20px 60px rgba(0,0,0,.3);transition:transform .6s var(--spring),opacity .3s}
#tray.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.tchip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.13);margin-bottom:6px;font-size:16px;font-weight:500;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.tchip .i{font-size:22px}.tchip em{margin-left:auto;font-style:normal;font-size:22px;opacity:.8}
body.hyper #editb{display:none}
.chart{width:100%;height:auto;display:block;overflow:visible}.ring{width:96px;height:96px;display:block;margin:2px auto 6px}
.bars{display:flex;align-items:flex-end;gap:2px;height:76px;margin:6px 0 8px}
.bars i{flex:1;border-radius:3px 3px 1px 1px;background:linear-gradient(#a6e7ff,#4aa8ff);opacity:.85;transform-origin:bottom}
.bars i.wet{background:linear-gradient(#d2f3ff,#1c8cff);opacity:1}
.rip{position:relative;overflow:hidden}

.h>.wi,.h>.dp{transition:transform .5s var(--spring)}.h:hover>.wi,.h:hover>.dp{transform:translateY(-3px) scale(1.15)}

<script>
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let place=null,data=null,SUNMIN=null;const DBG={};

/* ================= IKONY ================= */
const IC={
 sun:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><g class="ic-rays" stroke="#ffc93c" stroke-width="3" stroke-linecap="round"><path d="M24 3.5v5M24 39.5v5M3.5 24h5M39.5 24h5M9.5 9.5l3.5 3.5M35 35l3.5 3.5M38.5 9.5L35 13M13 35l-3.5 3.5"/></g><circle cx="24" cy="24" r="10.500" fill="url(#gSunC)"/></g>`,
 moon:(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><path transform="translate(2.5 2.5) scale(1.8)" d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="url(#gMoon)"/><circle class="ic-star" cx="37" cy="12" r="1.500" fill="#fff"/><circle class="ic-star" style="animation-delay:.9s" cx="41" cy="22" r="1" fill="#fff"/></g>`,
 cloud:(g,x,y,k)=>`<path transform="translate(${x} ${y}) scale(${k})" d="M13 38a8 8 0 0 1-1-15.9 11.5 11.5 0 0 1 21.6-2.4A9.2 9.2 0 0 1 35 38z" fill="url(#${g})"/>`,
 drops:(n,sm)=>`<g stroke="#62c8ff" stroke-width="3" stroke-linecap="round">${[17,25,33,21,29].slice(0,n).map((x,i)=>`<path class="ic-drop" style="animation-delay:${(i*.27).toFixed(2)}s" d="M${x} ${i>2?42:36}l-1.500 ${sm?3:5}"/>`).join('')}</g>`,
 flakes:()=>[16,24,32].map((x,i)=>`<g class="ic-flake" style="animation-delay:${i*.8}s" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><path d="M${x} ${35+(i%2)*4}v5M${x-2.2} ${36.5+(i%2)*4}l4.4 2M${x+2.2} ${36.5+(i%2)*4}l-4.4 2"/></g>`).join(''),
 bolt:()=>`<path class="ic-bolt" d="M26.500 27l-7.500 11h5.500l-2.5 8.500 10-13.5h-6l3-6z" fill="url(#gBolt)"/>`
};
function icon(code,day=1){
  let b;
  if(code<=1)b=day?IC.sun(0,0,1):IC.moon(0,0,1);
  else if(code===2)b=(day?IC.sun(9,-2,.74):IC.moon(6,-1,.8))+IC.cloud('gCloud',0,3,1);
  else if(code===3)b=IC.cloud('gCloudD',7,-6,.8)+IC.cloud('gCloud',-1,2,1);
  else if(code===45||code===48)b=IC.cloud('gCloud',0,-6,1)+'<g stroke="#e8eef8" stroke-width="3" stroke-linecap="round" opacity=".95"><path d="M9 37h26M14 43h26"/></g>';
  else if(code>=95)b=IC.cloud('gCloudS',0,-6,1)+IC.bolt();
  else if(code>=71&&code<=77||code===85||code===86)b=IC.cloud('gCloudD',0,-6,1)+IC.flakes();
  else if(code>=51&&code<=57)b=IC.cloud('gCloudD',0,-6,1)+IC.drops(3,1);
  else if(code>=51)b=IC.cloud('gCloudD',0,-6,1)+IC.drops(code===65||code===82?5:3,0);
  else b=IC.cloud('gCloud',0,0,1);
  return `<svg class="i wi" viewBox="0 0 48 48"><g filter="url(#fSh)">${b}</g></svg>`;
}
const WMO={0:'Bezchmurnie',1:'Prawie bezchmurnie',2:'Częściowe zachmurzenie',3:'Pochmurno',45:'Mgła',48:'Szadź',51:'Lekka mżawka',53:'Mżawka',55:'Silna mżawka',56:'Marznąca mżawka',57:'Marznąca mżawka',61:'Lekki deszcz',63:'Deszcz',65:'Silny deszcz',66:'Marznący deszcz',67:'Marznący deszcz',71:'Lekki śnieg',73:'Śnieg',75:'Intensywny śnieg',77:'Ziarna śniegu',80:'Przelotny deszcz',81:'Przelotny deszcz',82:'Ulewy',85:'Przelotny śnieg',86:'Przelotny śnieg',95:'Burza',96:'Burza z gradem',99:'Burza z gradem'};
const txt=c=>WMO[c]||'Pochmurno';

/* ================= NIEBO (canvas) ================= */
const cv=$('#sky'),cx=cv.getContext('2d'),cc=document.createElement('canvas'),cctx=cc.getContext('2d');
let FADE=null,W=0,H=0,SK=null,last=0,flash=0,nextFlash=4,FT=0,SHOOT=null,nextShoot=7;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mixC=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const rnd=(()=>{let s=12345;return()=>(s=(s*16807)%2147483647)/2147483647})();
const STARS=Array.from({length:230},()=>[rnd(),rnd()*.85,rnd(),rnd()*2+.5,rnd()]);
const BAND=Array.from({length:520},()=>{const u=rnd(),g=(rnd()+rnd()+rnd()-1.5)*.09;return[u,.12+u*.55+g,rnd()]});
let QS=1,fAcc=0,fCnt=0,qFrom=0;
function resize(){W=cv.width=cc.width=Math.round(innerWidth*QS);H=cv.height=cc.height=Math.round(innerHeight*QS);qFrom=performance.now();if(SK)initParticles()}
addEventListener('resize',resize);

// szum wartościowy okresowy w osi X (kafel bez szwów)
let SEED=0;
function hsh(x,y){let h=Math.imul(x,374761393)+Math.imul(y+SEED*7919,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}
function vn(x,y,per){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const x0=((xi%per)+per)%per,x1=(x0+1)%per;
  const a=hsh(x0,yi),b=hsh(x1,yi),c=hsh(x0,yi+1),d=hsh(x1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){x+=(vn(x*4,y*2,4)-.5)*.2;y+=(vn(x*4+9.1,y*2+3.3,4)-.5)*.2;let s=0,a=.5,f=3,n=0;for(let o=0;o<5;o++){s+=a*vn(x*f,y*f*.5,f);n+=a;a*=.5;f*=2}return s/n}
function fbmS(x,y){let s=0,a=.5,f=3,n=0;for(let o=0;o<3;o++){s+=a*vn(x*f,y*f*.5,f);n+=a;a*=.5;f*=2}return s/n}
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};

// pola szumu liczone raz (zmiana zachmurzenia i kolorów jest potem natychmiastowa)
const NF={};
function field(seed){
  if(NF[seed])return NF[seed];
  SEED=seed;const w=448,h=224,n=new Float32Array(w*h),s0=new Float32Array(w*h),s1=new Float32Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const u=x/w,v=y/h,i=y*w+x;n[i]=fbm(u,v);s0[i]=fbmS(u,v);s1[i]=fbmS(u-7/w,v-5/h)}
  return NF[seed]={w,h,n,s0,s1};
}
function makeClouds(cover,seed,lit,shade){
  const F=field(seed),w=F.w,h=F.h,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d'),im=g.createImageData(w,h),d=im.data,thr=.74-cover*.36,bs=.04+.16*(1-cover);
  for(let y=0;y<h;y++){const bias=y/h*bs;for(let x=0;x<w;x++){
    const i=y*w+x,nb=F.n[i]-bias,dens=sstep(thr,thr+.17,nb);if(dens<.004)continue;
    const depth=clamp((nb-thr)/.28),k=clamp(.62+(F.s0[i]-F.s1[i])*7+(F.n[i]-F.s0[i])*2.6-depth*.36+(1-dens)*.28),j=i*4;
    d[j]=shade[0]+(lit[0]-shade[0])*k;d[j+1]=shade[1]+(lit[1]-shade[1])*k;d[j+2]=shade[2]+(lit[2]-shade[2])*k;d[j+3]=dens*255;
  }}
  g.putImageData(im,0,0);return c;
}

const KF=[[-.3,'#040a1c','#0a1630','#16294d'],[-.08,'#0c1838','#1d2f5e','#3b4a7a'],[.02,'#27407f','#b8667e','#ffae6b'],[.2,'#3a6fc2','#7fa9dc','#f2d6b0'],[.5,'#2a6fd6','#5b9be8','#b9dbf7'],[1,'#1f66d6','#4f93e8','#b3d7f6']];
function skyAt(e){
  let i=0;while(i<KF.length-2&&e>KF[i+1][0])i++;
  const a=KF[i],b=KF[i+1],t=clamp((e-a[0])/(b[0]-a[0]));
  return [1,2,3].map(k=>mixC(hex(a[k]),hex(b[k]),t));
}

function buildSky(){
  if(SK&&W&&!RM){const sc=document.createElement('canvas');sc.width=W;sc.height=H;sc.getContext('2d').drawImage(cv,0,0);FADE={c:sc,t0:performance.now()}}
  const c=data.current,d=data.daily,code=DBG.code!=null?DBG.code:c.weather_code;
  const mins=s=>s?+s.slice(11,13)*60+ +s.slice(14,16):null;
  let ri=mins(d.sunrise[0]),se=mins(d.sunset[0]);if(ri==null||se==null||se<=ri){ri=360;se=1080}
  const now=DBG.min!=null?DBG.min:mins(c.time);SUNMIN={ri,se,cur:mins(c.time)};
  let f,e;
  if(now>=ri&&now<=se){f=(now-ri)/(se-ri);e=Math.sin(Math.PI*f)}
  else{f=(now>se?now-se:now+1440-se)/(1440-se+ri);e=-.6*Math.sin(Math.PI*f)}
  let kind='clear';
  if(code>=95)kind='storm';else if((code>=71&&code<=77)||code===85||code===86)kind='snow';
  else if(code>=51&&code<=82)kind='rain';else if(code===45||code===48)kind='fog';else if(code===3)kind='over';
  const rng={0:[0,.2],1:[.1,.35],2:[.35,.7],3:[.85,1]}[code];
  let cover=DBG.cover!=null?DBG.cover/100:(c.cloud_cover||0)/100;

function drawSun(g,s,sx,sy,sa,t){
  const m=Math.min(W,H),R=Math.max(W,H),low=clamp(1-s.e*4),warm=clamp(1-s.e*2.2);
  const col=mixC([255,250,238],[255,150,72],warm);
  let r=g.createRadialGradient(sx,sy,0,sx,sy,R*.95);
  r.addColorStop(0,rgb(col,.7*sa));r.addColorStop(.1,rgb(col,.4*sa));r.addColorStop(.35,rgb(col,.13*sa));r.addColorStop(.7,rgb(col,.04*sa));r.addColorStop(1,rgb(col,0));
  g.fillStyle=r;g.fillRect(0,0,W,H);
  if(low>.05){ // poświata przy horyzoncie
    g.save();g.translate(sx,H*.8);g.scale(1,.34);
    r=g.createRadialGradient(0,0,0,0,0,R*.75);r.addColorStop(0,rgb([255,150,80],.6*low*sa));r.addColorStop(.4,rgb([255,110,90],.22*low*sa));r.addColorStop(1,'rgba(255,110,90,0)');
    g.fillStyle=r;g.fillRect(-R,-R*1.2,2*R,2.4*R);g.restore();
  }
  const ra=sa*(s.cover>.08&&s.cover<.9?.09:.045);
  if(ra>.01){ // promienie przebijające przez chmury
    g.save();g.globalCompositeOperation='screen';const L=R*1.3;
    for(let i=0;i<18;i++){
      const a=i*.349+Math.sin(i*2.7)*.12+t*.012,hw=.016+.014*Math.abs(Math.sin(i*5.3));
      const ex=sx+Math.cos(a)*L,ey=sy+Math.sin(a)*L,px=-Math.sin(a)*L*hw,py=Math.cos(a)*L*hw;
      const lg=g.createLinearGradient(sx,sy,ex,ey),al=ra*(.55+.45*Math.sin(t*.35+i*1.7));
      lg.addColorStop(0,rgb(col,al));lg.addColorStop(1,rgb(col,0));
      g.fillStyle=lg;g.beginPath();g.moveTo(sx,sy);g.lineTo(ex+px,ey+py);g.lineTo(ex-px,ey-py);g.closePath();g.fill();
    }
    g.restore();
  }
  g.save();g.globalCompositeOperation='screen';
  r=g.createRadialGradient(sx,sy,0,sx,sy,m*.16);r.addColorStop(0,rgb([255,255,255],.95*sa));r.addColorStop(.2,rgb(col,.55*sa));r.addColorStop(1,rgb(col,0));
  g.fillStyle=r;g.beginPath();g.arc(sx,sy,m*.16,0,7);g.fill();
  if(s.cover<.6){ // pozioma smuga
    g.save();g.translate(sx,sy);g.scale(8,1);r=g.createRadialGradient(0,0,0,0,0,m*.045);
    r.addColorStop(0,rgb(col,.3*sa*(1-s.cover)));r.addColorStop(1,rgb(col,0));g.fillStyle=r;g.beginPath();g.arc(0,0,m*.045,0,7);g.fill();g.restore();
  }
  g.restore();
  const rd=m*.03*(1+low*1.2);
  r=g.createRadialGradient(sx,sy,0,sx,sy,rd*1.3);
  r.addColorStop(0,rgb([255,255,255],sa));r.addColorStop(.62,rgb(mixC([255,255,245],col,low*.8),sa));r.addColorStop(.8,rgb(col,.9*sa));r.addColorStop(1,rgb(col,0));
  g.fillStyle=r;g.beginPath();g.arc(sx,sy,rd*1.3,0,7);g.fill();
  const ha=(1-s.cover)*clamp(s.e*5)*(s.kind==='clear'?1:0)*.9;
  if(ha>.02){ // halo 22° i parhelia
    const rr=m*.34;r=g.createRadialGradient(sx,sy,rr*.8,sx,sy,rr*1.35);
    r.addColorStop(0,'rgba(255,210,170,0)');r.addColorStop(.28,'rgba(255,215,175,.10)');r.addColorStop(.45,'rgba(255,238,190,.22)');
    r.addColorStop(.6,'rgba(190,235,190,.12)');r.addColorStop(.78,'rgba(150,190,255,.12)');r.addColorStop(1,'rgba(150,190,255,0)');
    g.globalAlpha=ha;g.fillStyle=r;g.fillRect(0,0,W,H);
    if(s.e<.55)for(const sg of[-1,1]){const px=sx+sg*rr*1.02;r=g.createRadialGradient(px,sy,0,px,sy,m*.06);
      r.addColorStop(0,'rgba(255,245,220,.55)');r.addColorStop(.5,'rgba(255,205,150,.2)');r.addColorStop(1,'rgba(255,200,150,0)');g.fillStyle=r;g.fillRect(px-m*.06,sy-m*.06,m*.12,m*.12)}

let MALB=null,MPH=-9,MCV=null;
function moonAlbedo(){
  const N=192,a=new Float32Array(N*N);SEED=33;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const u=x/N,v=y/N,q=vn(u*3,v*3,3)*.55+vn(u*7,v*7,7)*.3+vn(u*15,v*15,15)*.15;
    a[y*N+x]=1-.45*sstep(.48,.62,q)+(vn(u*48,v*48,48)-.5)*.1}
  for(let k=0;k<44;k++){
    const px=(rnd()*.8+.1)*N,py=(rnd()*.8+.1)*N,r=(rnd()*rnd()*.1+.018)*N;
    for(let y=Math.max(0,(py-r*1.3)|0);y<Math.min(N,py+r*1.3);y++)for(let x=Math.max(0,(px-r*1.3)|0);x<Math.min(N,px+r*1.3);x++){
      const d=Math.hypot(x-px,y-py)/r;if(d>1.25)continue;
      a[y*N+x]+=(d<1?-.045*Math.pow(1-d,.6):0)+.05*Math.exp(-Math.pow((d-.9)/.2,2));

  }
  return{N,a};
}
function moonImage(ph){
  if(!MALB)MALB=moonAlbedo();
  if(MCV&&Math.abs(ph-MPH)<.003)return MCV;
  const{N,a}=MALB;if(!MCV){MCV=document.createElement('canvas');MCV.width=MCV.height=N}
  MPH=ph;const g=MCV.getContext('2d'),im=g.createImageData(N,N),d=im.data,al=2*Math.PI*ph,Lx=Math.sin(al),Lz=-Math.cos(al),R=N/2-1;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const nx=(x-N/2+.5)/R,ny=(y-N/2+.5)/R,rr=nx*nx+ny*ny;if(rr>1.02)continue;
    const nz=Math.sqrt(Math.max(0,1-rr)),lit=sstep(-.05,.18,nx*Lx+nz*Lz),v=clamp(a[y*N+x],0,1.2)*(.8+.2*nz)*(.06+.94*lit),e=1-lit,j=(y*N+x)*4;

function softGlow(g,x,y,R,col,a,k){

function drawMoon(g,s,mx,my,ma){

function spawnShoot(){const a=.45+Math.random()*.3;SHOOT={x:W*(.2+Math.random()*.5),y:H*(.04+Math.random()*.25),vx:Math.cos(a)*1100,vy:Math.sin(a)*1100,l:0}}

async function load(p){
  place=p;store.set('place',JSON.stringify(p));
  const my=++reqId,key=p.lat+','+p.lon;
  if(data&&data._k!==key)data=null;
  if(!data)$('#main').innerHTML=skel();
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}`+
  `&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,uv_index`+
  `&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility,dew_point_2m`+
  `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum`+
  `&minutely_15=precipitation&forecast_minutely_15=8&timezone=auto&forecast_days=10&wind_speed_unit=kmh`;
  try{
    const r=await fetch(u);if(!r.ok)throw 0;
    const j=await r.json();if(my!==reqId)return;
    j._k=key;data=j;store.set('cache',JSON.stringify({place:p,data:j}));render();lastLoad=Date.now();loadAQ(p,my);
  }catch(e){
    if(my!==reqId)return;
    if(!data)$('#main').innerHTML='<div class="err">Nie udało się pobrać prognozy. Sprawdź połączenie.<br><button class="more" style="display:block;max-width:240px;margin:16px auto 0" onclick="load(place)">Spróbuj ponownie</button></div>';
  }
}

  const v=Math.round(a.european_aqi),cat=v<=20?'Dobra':v<=40?'Zadowalająca':v<=60?'Umiarkowana':v<=80?'Zła':v<=100?'Bardzo zła':'Ekstremalnie zła';
  return lab+`<div class="big">${v}</div><div style="font-size:18px;font-weight:500">${cat}</div><div class="uvb"><i style="left:${clamp(v/120)*100}%"></i></div><div class="note">PM2.5: ${Math.round(a.pm2_5||0)} · PM10: ${Math.round(a.pm10||0)} µg/m³</div>`;
}
async function loadAQ(p,my){
  const k=p.lat+','+p.lon;
  try{
    const r=await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.lat}&longitude=${p.lon}&current=european_aqi,pm2_5,pm10&timezone=auto`);
    const j=await r.json();if(my!==reqId)return;
    AQ=j.current?Object.assign({k},j.current):{k,err:1};
  }catch(e){if(my!==reqId)return;AQ={k,err:1}}
  const el=document.querySelector('.aqin');if(el)el.innerHTML=aqHTML();
}

function moonSVG(ph){

const phName=p=>p<.03||p>.97?'Nów':p<.22?'Przybywający sierp':p<.28?'Pierwsza kwadra':p<.47?'Przybywający garb':p<.53?'Pełnia':p<.72?'Ubywający garb':p<.78?'Ostatnia kwadra':'Ubywający sierp';

  $('#dL').onclick=()=>{flash=1};
  $('#dS').onclick=()=>spawnShoot();
  $('#dF').onchange=e=>{DBG.freeze=e.target.checked};
  $('#dR').onclick=()=>{for(const k in DBG)delete DBG[k];$('#dF').checked=false;apply()};
  const hd=box.querySelector('h4');hd.style.cursor='grab';hd.style.touchAction='none';
  hd.onpointerdown=e=>{if(e.target.closest('button'))return;const r=box.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;hd.setPointerCapture(e.pointerId);
    hd.onpointermove=m=>{box.style.left=clamp(m.clientX-dx,0,innerWidth-80)+'px';box.style.top=clamp(m.clientY-dy,0,innerHeight-60)+'px';box.style.bottom='auto'};
    hd.onpointerup=()=>{hd.onpointermove=null}};
  const tog=()=>{box.classList.toggle('on');sync()};
  $('#dbgb').onclick=tog;$('#dX').onclick=tog;
  addEventListener('keydown',e=>{if((e.key==='d'||e.key==='D')&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&!e.ctrlKey&&!e.metaKey)tog()});
})();
</script>
</body>
</html>
